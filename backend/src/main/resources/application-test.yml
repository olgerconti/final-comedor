spring:
  datasource:
    url: jdbc:h2:mem:comedor_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

server:
  port: 8080

app:
  jwt:
    secret: comedor-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
    expiration-ms: 86400000